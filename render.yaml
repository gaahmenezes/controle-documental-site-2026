# Blueprint opcional do Render para o backend.
# Só tem efeito se alguém criar um "Blueprint" no Render apontando para este
# repositório. O serviço que já está no ar não é afetado por este arquivo.
# Os segredos (DATABASE_URL, API_KEY) NUNCA ficam aqui: são preenchidos no painel.
services:
  - type: web
    name: controle-documental-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
